<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Emilly Santos - Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #c9184a;
  --pink-dark: #a01435;
  --bg: #f8f9fa;
  --card: #ffffff;
  --text: #1a1a2e;
  --muted: #6b7280;
  --border: #e5e7eb;
  --success: #10b981;
  --warning: #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: linear-gradient(135deg, var(--pink-dark), var(--pink));
  padding: 20px 24px;
  color: white;
  text-align: center;
}

header h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
header p { font-size: 11px; opacity: 0.85; letter-spacing: 1.5px; text-transform: uppercase; }

/* TABS */
.tabs {
  display: flex;
  gap: 0;
  padding: 0 24px;
  max-width: 700px;
  margin: 20px auto 0;
  width: 100%;
}

.tab-btn {
  flex: 1;
  padding: 12px 8px;
  border: none;
  background: var(--card);
  border-bottom: 3px solid var(--border);
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.3s;
  border-radius: 12px 12px 0 0;
}

.tab-btn.active {
  color: var(--pink);
  border-bottom-color: var(--pink);
}

.tab-content { display: none; }
.tab-content.active { display: block; }

main {
  flex: 1;
  padding: 20px 24px 40px;
  max-width: 700px;
  margin: 0 auto;
  width: 100%;
}

/* CARD */
.card {
  background: var(--card);
  border-radius: 0 0 16px 16px;
  padding: 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid var(--border);
  border-top: none;
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--pink);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-group { margin-bottom: 12px; }

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--pink);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
}

.btn-primary {
  background: linear-gradient(135deg, var(--pink-dark), var(--pink));
  color: white;
}

.btn-danger {
  background: #ef4444;
  color: white;
  padding: 6px 10px;
  font-size: 12px;
  width: auto;
  border-radius: 8px;
}

.btn-success {
  background: var(--success);
  color: white;
  padding: 6px 10px;
  font-size: 12px;
  width: auto;
  border-radius: 8px;
}

.btn-outline {
  background: none;
  border: 1.5px solid var(--pink);
  color: var(--pink);
  padding: 6px 10px;
  font-size: 12px;
  width: auto;
  border-radius: 8px;
}

/* ENTRY */
.entry {
  padding: 14px;
  border-left: 4px solid var(--pink);
  background: var(--bg);
  border-radius: 12px;
  margin-bottom: 10px;
}

.entry.confirmed {
  border-left-color: var(--success);
}

.entry-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 6px;
}

.entry-name { font-size: 14px; font-weight: 600; flex: 1; }
.entry-price { font-weight: 700; color: var(--pink); font-size: 15px; white-space: nowrap; }

.entry-desc { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

.entry-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.entry-status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 4px;
}

.status-pendente {
  background: #fef3c7;
  color: #92400e;
}

.status-confirmado {
  background: #d1fae5;
  color: #065f46;
}

.status-cancelado {
  background: #fee2e2;
  color: #991b1b;
}

.anamnese-box {
  background: var(--bg);
  border-radius: 8px;
  padding: 10px 12px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--muted);
  display: none;
}

.anamnese-box.show { display: block; }

.anamnese-row {
  display: flex;
  gap: 8px;
  padding: 2px 0;
}

.anamnese-label { font-weight: 600; min-width: 100px; }

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 14px;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, var(--pink-dark), var(--pink));
  color: white;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  z-index: 9999;
  animation: slideUp 0.4s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@media (max-width: 768px) {
  main { padding: 16px; }
  .card { padding: 16px; }
  .tabs { padding: 0 16px; }
  .tab-btn { font-size: 11px; padding: 10px 4px; }
}
</style>
</head>
<body>

<header>
  <h1>Studio Emilly Santos</h1>
  <p>Painel de Controle</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('anotar', this)">📝 Anotar</button>
  <button class="tab-btn" onclick="switchTab('historico', this)">📋 Histórico</button>
  <button class="tab-btn" onclick="switchTab('agendamentos', this)">📅 Agendamentos</button>
</div>

<main>

  <!-- ABA ANOTAR -->
  <div class="tab-content active" id="tab-anotar">
    <div class="card">
      <h2 class="card-title">Anotar Procedimento</h2>
      <form id="form-anotar">
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="nome" placeholder="Nome da cliente" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Data</label>
            <input type="date" id="data" required>
          </div>
          <div class="form-group">
            <label>Telefone</label>
            <input type="tel" id="tel" placeholder="(11) 99999-9999">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Procedimento</label>
            <select id="proc" required>
              <option value="">Selecione</option>
              <option>Manicure</option>
              <option>Pedicure</option>
              <option>Unhas Postiças</option>
              <option>Design de Sobrancelha</option>
            </select>
          </div>
          <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" id="valor" placeholder="0,00" step="0.01" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Forma de Pagamento</label>
            <select id="pagamento" required>
              <option value="">Selecione</option>
              <option>Dinheiro</option>
              <option>PIX</option>
              <option>Cartão</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="Confirmado">Confirmado</option>
              <option value="Pendente">Pendente</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Horário Início</label>
            <input type="time" id="hora-inicio">
          </div>
          <div class="form-group">
            <label>Horário Fim</label>
            <input type="time" id="hora-fim">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-submit">Anotar</button>
      </form>
    </div>
  </div>

  <!-- ABA HISTÓRICO -->
  <div class="tab-content" id="tab-historico">
    <div class="card">
      <h2 class="card-title">Histórico de Procedimentos</h2>
      <div id="lista-historico"><div class="empty">Nenhum registro anotado</div></div>
    </div>
  </div>

  <!-- ABA AGENDAMENTOS -->
  <div class="tab-content" id="tab-agendamentos">
    <div class="card">
      <h2 class="card-title">Agendamentos Recebidos</h2>
      <div id="lista-agendamentos"><div class="empty">Nenhum agendamento recebido</div></div>
    </div>
  </div>

</main>

<script>
// ════════════════════════════════════════════════════
//  CONFIGURAÇÃO FIREBASE
// ════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDBr3kQaZj_g_gxJ_h2f2zWv5C_-K9yEts",
  authDomain: "studio-emilly-santos.firebaseapp.com",
  databaseURL: "https://studio-emilly-santos-default-rtdb.firebaseio.com",
  projectId: "studio-emilly-santos",
  storageBucket: "studio-emilly-santos.appspot.com",
  messagingSenderId: "360676621995",
  appId: "1:360676621995:web:c0d9e78fea71c99ffc3e30"
};

let editId = null;
let db = null;
let registrosData = [];
let agendamentosData = [];

// ════════════════════════════════════════════════════
//  MÁSCARA TEL
// ════════════════════════════════════════════════════
document.getElementById('tel').addEventListener('input', function(e){
  let v = e.target.value.replace(/\D/g,'');
  if(v.length > 11) v = v.slice(0,11);
  if(v.length===0){ e.target.value=''; return; }
  if(v.length<=2) v='('+v;
  else if(v.length<=7) v='('+v.slice(0,2)+') '+v.slice(2);
  else v='('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);
  e.target.value=v;
});

// ════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// ════════════════════════════════════════════════════
//  TABS
// ════════════════════════════════════════════════════
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

// ════════════════════════════════════════════════════
//  FIREBASE INIT
// ════════════════════════════════════════════════════
import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js').then(({initializeApp}) => {
  import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js').then(({getDatabase, ref, push, onValue, remove, set, get}) => {
    const app = initializeApp(FIREBASE_CONFIG);
    db = getDatabase(app);

    // ═══ SALVAR REGISTRO ═══
    document.getElementById('form-anotar').addEventListener('submit', (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const data = document.getElementById('data').value;
      const tel = document.getElementById('tel').value.trim();
      const proc = document.getElementById('proc').value;
      const valor = document.getElementById('valor').value;
      const pagamento = document.getElementById('pagamento').value;
      const status = document.getElementById('status').value;
      const horaInicio = document.getElementById('hora-inicio').value;
      const horaFim = document.getElementById('hora-fim').value;

      if (!nome || !data || !proc || !valor || !pagamento) {
        toast('Preencha os campos obrigatórios');
        return;
      }

      const dados = {
        nome, data, tel, proc,
        valor: parseFloat(valor).toFixed(2),
        pagamento, status, horaInicio, horaFim,
        criadoEm: new Date().toISOString()
      };

      if (editId !== null) {
        set(ref(db, 'registros/' + editId), dados).then(() => {
          toast('Atualizado!');
          cancelEdit();
        });
      } else {
        push(ref(db, 'registros'), dados).then(() => {
          toast('Anotado!');
        });
      }

      e.target.reset();
    });

    // ═══ MIGRAR DADOS ANTIGOS DO LOCALSTORAGE ═══
    const oldData = JSON.parse(localStorage.getItem('registros') || '[]');
    if (oldData.length > 0) {
      oldData.forEach(item => {
        push(ref(db, 'registros'), {
          nome: item.nome || '',
          data: item.data || '',
          tel: item.tel || '',
          proc: item.proc || '',
          valor: item.valor || '0.00',
          pagamento: item.pagamento || '',
          status: item.status || 'Confirmado',
          horaInicio: item.horaInicio || '',
          horaFim: item.horaFim || '',
          criadoEm: new Date().toISOString()
        });
      });
      localStorage.removeItem('registros');
      toast('Dados antigos migrados!');
    }

    // ═══ CARREGAR REGISTROS (HISTÓRICO) ═══
    onValue(ref(db, 'registros'), (snap) => {
      registrosData = [];
      snap.forEach(child => {
        registrosData.push({ id: child.key, ...child.val() });
      });
      registrosData.sort((a,b) => new Date(b.data) - new Date(a.data));
      renderHistorico();
    });

    // ═══ CARREGAR AGENDAMENTOS ═══
    onValue(ref(db, 'agendamentos'), (snap) => {
      agendamentosData = [];
      snap.forEach(child => {
        agendamentosData.push({ id: child.key, ...child.val() });
      });
      agendamentosData.sort((a,b) => new Date(a.data+' '+a.hora) - new Date(b.data+' '+b.hora));
      renderAgendamentos();
    });

    // ═══ RENDER HISTÓRICO ═══
    function renderHistorico() {
      const html = registrosData.length ? registrosData.map(r => `
        <div class="entry confirmed">
          <div class="entry-header">
            <div>
              <div class="entry-name">${r.nome}</div>
              <div class="entry-desc">
                📅 ${new Date(r.data+'T00:00:00').toLocaleDateString('pt-BR')} • ${r.proc}
                ${r.tel ? ' • 📱 '+r.tel : ''}
                ${r.pagamento ? ' • 💰 '+r.pagamento : ''}
                ${r.horaInicio ? ' • 🕐 '+r.horaInicio+(r.horaFim ? '-'+r.horaFim : '') : ''}
              </div>
            </div>
            <div class="entry-price">R$ ${r.valor}</div>
          </div>
          <div class="entry-actions">
            <button class="btn btn-outline" onclick="editarRegistro('${r.id}')">✏️</button>
            <button class="btn btn-danger" onclick="deletarRegistro('${r.id}')">✕</button>
          </div>
        </div>
      `).join('') : '<div class="empty">Nenhum registro anotado</div>';

      document.getElementById('lista-historico').innerHTML = html;
    }

    // ═══ RENDER AGENDAMENTOS ═══
    function renderAgendamentos() {
      const html = agendamentosData.length ? agendamentosData.map(a => `
        <div class="entry ${a.status === 'Confirmado' ? 'confirmed' : ''}">
          <div class="entry-status status-${a.status ? a.status.toLowerCase() : 'pendente'}">${a.status || 'Pendente'}</div>
          <div class="entry-header">
            <div>
              <div class="entry-name">${a.nome}</div>
              <div class="entry-desc">
                📅 ${new Date(a.data+'T00:00:00').toLocaleDateString('pt-BR')} às ${a.hora} • ${a.proc}
                ${a.tel ? ' • 📱 '+a.tel : ''}
              </div>
            </div>
          </div>
          ${a.anamnese ? `
            <div class="anamnese-box" id="anamnese-${a.id}">
              ${a.anamnese.diabetes ? '<div class="anamnese-row"><span class="anamnese-label">Diabetes:</span> '+a.anamnese.diabetes+'</div>' : ''}
              ${a.anamnese.gestante ? '<div class="anamnese-row"><span class="anamnese-label">Gestante:</span> '+a.anamnese.gestante+'</div>' : ''}
              ${a.anamnese.alergia ? '<div class="anamnese-row"><span class="anamnese-label">Alergia:</span> '+a.anamnese.alergia+(a.anamnese.alergiaDetalhe ? ' ('+a.anamnese.alergiaDetalhe+')' : '')+'</div>' : ''}
              ${a.anamnese.micose ? '<div class="anamnese-row"><span class="anamnese-label">Micose:</span> '+a.anamnese.micose+'</div>' : ''}
              ${a.anamnese.medicamento ? '<div class="anamnese-row"><span class="anamnese-label">Medicamento:</span> '+a.anamnese.medicamento+(a.anamnese.medicamentoDetalhe ? ' ('+a.anamnese.medicamentoDetalhe+')' : '')+'</div>' : ''}
              ${a.anamnese.encravada ? '<div class="anamnese-row"><span class="anamnese-label">Unha encravada:</span> '+a.anamnese.encravada+'</div>' : ''}
              ${a.anamnese.esporte ? '<div class="anamnese-row"><span class="anamnese-label">Esporte:</span> '+a.anamnese.esporte+'</div>' : ''}
            </div>
          ` : ''}
          <div class="entry-actions">
            ${a.status !== 'Confirmado' ? `<button class="btn btn-success" onclick="confirmarAgend('${a.id}')">✓ Confirmar</button>` : ''}
            ${a.anamnese ? `<button class="btn btn-outline" onclick="toggleAnamnese('${a.id}')">📋 Anamnese</button>` : ''}
            <button class="btn btn-danger" onclick="deletarAgend('${a.id}')">✕</button>
          </div>
        </div>
      `).join('') : '<div class="empty">Nenhum agendamento recebido</div>';

      document.getElementById('lista-agendamentos').innerHTML = html;
    }

    // ═══ CONFIRMAR AGENDAMENTO ═══
    window.confirmarAgend = function(id) {
      set(ref(db, 'agendamentos/' + id + '/status'), 'Confirmado').then(() => {
        toast('Agendamento confirmado!');
      });
    };

    // ═══ DELETAR AGENDAMENTO ═══
    window.deletarAgend = function(id) {
      if (!confirm('Remover agendamento?')) return;
      remove(ref(db, 'agendamentos/' + id)).then(() => {
        toast('Removido');
      });
    };

    // ═══ TOGGLE ANAMNESE ═══
    window.toggleAnamnese = function(id) {
      const el = document.getElementById('anamnese-' + id);
      if (el) el.classList.toggle('show');
    };

    // ═══ EDITAR REGISTRO ═══
    window.editarRegistro = function(id) {
      get(ref(db, 'registros/' + id)).then((snap) => {
        const r = snap.val();
        if (!r) return;
        editId = id;
        document.getElementById('nome').value = r.nome;
        document.getElementById('data').value = r.data;
        document.getElementById('tel').value = r.tel || '';
        document.getElementById('proc').value = r.proc;
        document.getElementById('valor').value = r.valor;
        document.getElementById('pagamento').value = r.pagamento || '';
        document.getElementById('status').value = r.status || 'Confirmado';
        document.getElementById('hora-inicio').value = r.horaInicio || '';
        document.getElementById('hora-fim').value = r.horaFim || '';
        document.getElementById('btn-submit').textContent = 'Atualizar';
        document.getElementById('btn-submit').style.background = 'linear-gradient(135deg, #3b82f6, #2563eb)';
        toast('Editando...');
        switchTab('anotar', document.querySelectorAll('.tab-btn')[0]);
      });
    };

    // ═══ DELETAR REGISTRO ═══
    window.deletarRegistro = function(id) {
      if (!confirm('Remover registro?')) return;
      remove(ref(db, 'registros/' + id)).then(() => {
        toast('Removido');
      });
    };

    // ═══ CANCELAR EDIÇÃO ═══
    window.cancelEdit = function() {
      editId = null;
      document.getElementById('btn-submit').textContent = 'Anotar';
      document.getElementById('btn-submit').style.background = '';
      document.getElementById('form-anotar').reset();
    };

  });
});
</script>

</body>
</html>
