<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Emilly Santos - Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #c9184a;
    --pink-dark: #a01435;
    --bg: #f8f9fa;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --success: #10b981;
    --warning: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Loading screen */
  #loading-screen {
    position: fixed; inset: 0;
    background: #fff5f8;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 16px;
  }
  #loading-screen .logo-spin {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink-dark), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif; font-size: 24px; font-weight: 700; color: #fff;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%       { transform: scale(1.08); opacity: 0.85; }
  }
  #loading-screen p { font-size: 13px; color: #9a6475; }

  header {
    background: linear-gradient(135deg, var(--pink-dark), var(--pink));
    padding: 20px 24px;
    color: white;
    text-align: center;
    position: relative;
  }
  header h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  header p { font-size: 11px; opacity: 0.85; letter-spacing: 1.5px; text-transform: uppercase; }

  #btn-logout {
    position: absolute; top: 50%; right: 20px;
    transform: translateY(-50%);
    background: none;
    border: 1px solid rgba(255,255,255,0.7);
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    transition: background 0.2s;
    white-space: nowrap;
  }
  #btn-logout:hover { background: rgba(255,255,255,0.15); }

  /* TABS */
  .tabs {
    display: flex;
    padding: 0 24px;
    max-width: 700px;
    margin: 20px auto 0;
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab-btn {
    flex: 1; padding: 12px 8px;
    border: none;
    background: var(--card);
    border-bottom: 3px solid var(--border);
    font-family: 'Outfit', sans-serif;
    font-size: 13px; font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 12px 12px 0 0;
    flex-shrink: 0;
    min-width: 100px;
  }
  .tab-btn.active {
    color: var(--pink);
    border-bottom-color: var(--pink);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  main {
    flex: 1;
    padding: 20px 24px 40px;
    max-width: 700px;
    margin: 0 auto;
    width: 100%;
  }

  .card {
    background: var(--card);
    border-radius: 0 0 16px 16px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 1px solid var(--border);
    border-top: none;
  }

  .card-title {
    font-size: 16px; font-weight: 700;
    color: var(--pink);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }

  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .form-group input,
  .form-group select {
    width: 100%; padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    background: #fff;
  }
  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--pink);
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn {
    padding: 12px 20px;
    border: none; border-radius: 10px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.3s ease;
    width: 100%;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--pink-dark), var(--pink));
    color: white;
  }
  .btn-danger {
    background: #ef4444; color: white;
    padding: 8px 12px; font-size: 12px; width: auto;
    border-radius: 8px; min-height: 36px;
  }
  .btn-success {
    background: var(--success); color: white;
    padding: 8px 12px; font-size: 12px; width: auto;
    border-radius: 8px; min-height: 36px;
  }
  .btn-outline {
    background: none; border: 1.5px solid var(--pink);
    color: var(--pink);
    padding: 8px 12px; font-size: 12px; width: auto;
    border-radius: 8px; min-height: 36px;
  }

  /* ENTRY */
  .entry {
    padding: 14px;
    border-left: 4px solid var(--pink);
    background: var(--bg);
    border-radius: 12px;
    margin-bottom: 10px;
  }
  .entry.confirmed { border-left-color: var(--success); }
  .entry-header {
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 10px; margin-bottom: 6px;
  }
  .entry-name { font-size: 14px; font-weight: 600; flex: 1; }
  .entry-price { font-weight: 700; color: var(--pink); font-size: 15px; white-space: nowrap; }
  .entry-desc { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .entry-actions { display: flex; gap: 6px; margin-top: 8px; }

  .entry-status {
    display: inline-block; padding: 2px 8px;
    border-radius: 6px; font-size: 11px; font-weight: 600;
    margin-bottom: 4px;
  }
  .status-pendente   { background: #fef3c7; color: #92400e; }
  .status-confirmado { background: #d1fae5; color: #065f46; }
  .status-cancelado  { background: #fee2e2; color: #991b1b; }

  .anamnese-box {
    background: var(--bg); border-radius: 8px;
    padding: 10px 12px; margin-top: 8px;
    font-size: 12px; color: var(--muted);
    display: none;
  }
  .anamnese-box.show { display: block; }
  .anamnese-row { display: flex; gap: 8px; padding: 2px 0; }
  .anamnese-label { font-weight: 600; min-width: 100px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--pink-dark), var(--pink));
    color: white; padding: 12px 20px;
    border-radius: 10px; font-size: 13px;
    z-index: 9999; animation: slideUp 0.4s ease;
    white-space: nowrap;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @media (max-width: 768px) {
    main { padding: 12px; }
    .card { padding: 14px; }
    .tabs { padding: 0 12px; }
    .tab-btn { font-size: 11px; padding: 10px 6px; min-width: 80px; }
    .entry-actions { flex-wrap: wrap; }
    .entry-actions .btn { padding: 10px 14px; min-height: 40px; font-size: 13px; }
    .entry-header { flex-direction: column; gap: 4px; }
    .entry-price { align-self: flex-start; }
    #btn-logout { font-size: 11px; padding: 5px 9px; }
  }
  @media (max-width: 480px) {
    header h1 { font-size: 18px; }
    .tabs { padding: 0 8px; }
    .tab-btn { font-size: 10px; padding: 8px 4px; min-width: 64px; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<!-- Loading screen -->
<div id="loading-screen">
  <div class="logo-spin">ES</div>
  <p>Carregando...</p>
</div>

<!-- CONTEÚDO PRINCIPAL (oculto até autenticação confirmar) -->
<div id="app" style="display:none; flex-direction:column; min-height:100vh; flex:1;">

  <header>
    <h1>Studio Emilly Santos</h1>
    <p>Painel de Controle</p>
    <button id="btn-logout" onclick="logout()">Sair</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('anotar', this)">📝 Anotar</button>
    <button class="tab-btn" onclick="switchTab('historico', this)">📋 Histórico</button>
    <button class="tab-btn" onclick="switchTab('agendamentos', this)">📅 Agend.</button>
    <button class="tab-btn" onclick="switchTab('confirmados', this)">✅ Confirm.</button>
    <button class="tab-btn" onclick="switchTab('financeiro', this)">💰 Financeiro</button>
  </div>

  <main>
    <!-- ABA ANOTAR -->
    <div class="tab-content active" id="tab-anotar">
      <div class="card">
        <h2 class="card-title">✏️ Anotar Procedimento</h2>
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="nome" placeholder="Nome da cliente">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Data</label>
            <input type="date" id="data">
          </div>
          <div class="form-group">
            <label>Telefone</label>
            <input type="tel" id="tel" placeholder="(11) 99999-9999">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Procedimento</label>
            <select id="proc">
              <option value="">Selecione</option>
              <option>Manicure</option>
              <option>Pedicure</option>
              <option>Unhas Postiças</option>
              <option>Design de Sobrancelha</option>
              <option>Pé</option>
              <option>Mão</option>
              <option>Pé e mão</option>
              <option>SPA dos pés</option>
              <option>Postiça simples</option>
              <option>Postiça decorada</option>
            </select>
          </div>
          <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" id="valor" placeholder="0,00" step="0.01">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Forma de Pagamento</label>
            <select id="pagamento">
              <option value="">Selecione</option>
              <option>Dinheiro</option>
              <option>PIX</option>
              <option>Cartão</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="Confirmado">Confirmado</option>
              <option value="Pendente">Pendente</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Horário Início</label>
            <input type="time" id="hora-inicio">
          </div>
          <div class="form-group">
            <label>Horário Fim</label>
            <input type="time" id="hora-fim">
          </div>
        </div>
        <button class="btn btn-primary" id="btn-submit" onclick="salvarRegistro()">Anotar</button>
      </div>
    </div>

    <!-- ABA HISTÓRICO -->
    <div class="tab-content" id="tab-historico">
      <div class="card">
        <h2 class="card-title">📋 Histórico de Procedimentos</h2>
        <div id="lista-historico"><div class="empty">Nenhum registro anotado</div></div>
      </div>
    </div>

    <!-- ABA AGENDAMENTOS -->
    <div class="tab-content" id="tab-agendamentos">
      <div class="card">
        <h2 class="card-title">📅 Agendamentos Recebidos</h2>
        <div id="lista-agendamentos"><div class="empty">Nenhum agendamento recebido</div></div>
      </div>
    </div>

    <!-- ABA CONFIRMADOS -->
    <div class="tab-content" id="tab-confirmados">
      <div class="card">
        <h2 class="card-title">✅ Agendamentos Confirmados</h2>
        <div id="lista-confirmados"><div class="empty">Nenhum agendamento confirmado</div></div>
      </div>
    </div>

    <!-- ABA FINANCEIRO -->
    <div class="tab-content" id="tab-financeiro">
      <div class="card">
        <h2 class="card-title">💰 Financeiro</h2>
        <div id="financeiro-resumo"></div>
        <div id="financeiro-detalhes" style="margin-top:20px;"></div>
      </div>
    </div>
  </main>

</div><!-- /app -->

<script>
// ══════════════════════════════════════════
// FIREBASE CONFIG
// ══════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyALLJn7hEnTxvTN2SNVzkAEs1HAwUG24hE",
  authDomain: "studio-emilly.firebaseapp.com",
  databaseURL: "https://studio-emilly-default-rtdb.firebaseio.com",
  projectId: "studio-emilly",
  storageBucket: "studio-emilly.appspot.com",
  messagingSenderId: "130072077830",
  appId: "1:130072077830:web:694aa5bb37307dae260587"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.database();

// ══ AUTH GUARD ══
auth.onAuthStateChanged(function(user) {
  document.getElementById('loading-screen').style.display = 'none';
  if (!user) {
    window.location.replace('/login.html');
  } else {
    const app = document.getElementById('app');
    app.style.display = 'flex';
    iniciarApp();
  }
});

// ══ LOGOUT ══
function logout() {
  auth.signOut().then(function() {
    window.location.replace('/login.html');
  });
}

// ══════════════════════════════════════════
// DADOS GLOBAIS
// ══════════════════════════════════════════
let editId = null;
let registrosData = [];
let agendamentosData = [];

// ══ FORMATO DE DATA ══
function formatDateBR(dateStr) {
  if (!dateStr) return 'Data inválida';
  const parts = dateStr.split('-');
  if (parts.length !== 3) return 'Data inválida';
  const [year, month, day] = parts;
  return `${day}/${month}/${year}`;
}

// ══ TOAST ══
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// ══ TABS ══
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'financeiro') renderFinanceiro();
  if (tab === 'confirmados') renderConfirmados();
  if (tab === 'historico') renderHistorico();
}

// ══ MÁSCARA TELEFONE ══
function mascaraTel(input) {
  let v = input.value.replace(/\D/g, '');
  if (v.length > 11) v = v.slice(0, 11);
  if (v.length === 0) { input.value = ''; return; }
  if (v.length <= 2) v = '(' + v;
  else if (v.length <= 7) v = '(' + v.slice(0, 2) + ') ' + v.slice(2);
  else v = '(' + v.slice(0, 2) + ') ' + v.slice(2, 7) + '-' + v.slice(7);
  input.value = v;
}

// ══════════════════════════════════════════
// INIT APP (chamado após auth confirmada)
// ══════════════════════════════════════════
function iniciarApp() {
  // Máscara tel
  document.getElementById('tel').addEventListener('input', function() { mascaraTel(this); });

  // Migrar dados localstorage antigos
  const oldData = JSON.parse(localStorage.getItem('registros') || '[]');
  if (oldData.length > 0) {
    oldData.forEach(item => {
      db.ref('registros').push({
        nome: item.nome || '',
        data: item.data || '',
        tel: item.tel || '',
        proc: item.proc || '',
        valor: item.valor || '0.00',
        pagamento: item.pagamento || '',
        status: item.status || 'Confirmado',
        horaInicio: item.horaInicio || '',
        horaFim: item.horaFim || '',
        criadoEm: new Date().toISOString()
      });
    });
    localStorage.removeItem('registros');
    toast('Dados antigos migrados!');
  }

  // Carregar registros
  db.ref('registros').on('value', function(snap) {
    registrosData = [];
    snap.forEach(function(child) {
      registrosData.push({ ...child.val(), id: child.key });
    });
    registrosData.sort((a, b) => new Date(b.data) - new Date(a.data));
    renderHistorico();
  });

  // Carregar agendamentos
  db.ref('agendamentos').on('value', function(snap) {
    agendamentosData = [];
    snap.forEach(function(child) {
      agendamentosData.push({ ...child.val(), id: child.key });
    });
    agendamentosData.sort((a, b) => {
      return new Date(a.data + 'T' + (a.hora || '00:00') + ':00') - new Date(b.data + 'T' + (b.hora || '00:00') + ':00');
    });
    renderAgendamentos();
    renderConfirmados();
  });
}

// ══════════════════════════════════════════
// SALVAR REGISTRO
// ══════════════════════════════════════════
function salvarRegistro() {
  const nome      = document.getElementById('nome').value.trim();
  const data      = document.getElementById('data').value;
  const tel       = document.getElementById('tel').value.trim();
  const proc      = document.getElementById('proc').value;
  const valor     = document.getElementById('valor').value;
  const pagamento = document.getElementById('pagamento').value;
  const status    = document.getElementById('status').value;
  const horaInicio = document.getElementById('hora-inicio').value;
  const horaFim   = document.getElementById('hora-fim').value;

  if (!nome || !data || !proc || !valor || !pagamento) {
    toast('Preencha os campos obrigatórios');
    return;
  }

  const telDigits = tel.replace(/\D/g, '');
  if (telDigits.length > 0 && telDigits.length < 10) {
    toast('Telefone inválido: mínimo 10 dígitos');
    return;
  }

  const dados = {
    nome, data, tel, proc,
    valor: parseFloat(valor).toFixed(2),
    pagamento, status, horaInicio, horaFim,
    criadoEm: new Date().toISOString()
  };

  if (editId !== null) {
    db.ref('registros/' + editId).set(dados)
      .then(function() { toast('Atualizado!'); cancelEdit(); })
      .catch(function(err) { console.error(err); toast('Erro ao atualizar.'); });
  } else {
    db.ref('registros').push(dados)
      .then(function() { toast('Anotado!'); document.getElementById('nome').value = ''; document.getElementById('data').value = ''; document.getElementById('tel').value = ''; document.getElementById('proc').value = ''; document.getElementById('valor').value = ''; document.getElementById('pagamento').value = ''; document.getElementById('hora-inicio').value = ''; document.getElementById('hora-fim').value = ''; })
      .catch(function(err) { console.error(err); toast('Erro ao salvar.'); });
  }
}

// ══ RENDER HISTÓRICO ══
function renderHistorico() {
  const html = registrosData.length ? registrosData.map(r => `
    <div class="entry${r.status === 'Confirmado' ? ' confirmed' : ''}">
      <div class="entry-status status-${(r.status || 'pendente').toLowerCase()}">${r.status || 'Pendente'}</div>
      <div class="entry-header">
        <div>
          <div class="entry-name">${r.nome}</div>
          <div class="entry-desc">
            📅 ${formatDateBR(r.data)} • ${r.proc || 'Serviço'}
            ${r.tel ? ' • 📱 ' + r.tel : ''}
            ${r.pagamento ? ' • 💰 ' + r.pagamento : ''}
            ${r.horaInicio ? ' • 🕐 ' + r.horaInicio + (r.horaFim ? '-' + r.horaFim : '') : ''}
          </div>
        </div>
        <div class="entry-price">R$ ${r.valor}</div>
      </div>
      <div class="entry-actions">
        <button class="btn btn-outline" onclick="editarRegistro('${r.id}')">✏️</button>
        <button class="btn btn-danger" onclick="deletarRegistro('${r.id}')">✕</button>
      </div>
    </div>
  `).join('') : '<div class="empty">Nenhum registro anotado</div>';
  document.getElementById('lista-historico').innerHTML = html;
}

// ══ RENDER AGENDAMENTOS (pendentes) ══
function renderAgendamentos() {
  const pendentes = agendamentosData.filter(a => a.status !== 'Confirmado');
  const html = pendentes.length ? pendentes.map(a => `
    <div class="entry">
      <div class="entry-status status-${(a.status || 'pendente').toLowerCase()}">${a.status || 'Pendente'}</div>
      <div class="entry-header">
        <div>
          <div class="entry-name">${a.nome}</div>
          <div class="entry-desc">
            📅 ${formatDateBR(a.data)} às ${a.hora || '??:??'} • ${a.proc || 'Serviço'}
            ${a.tel ? ' • 📱 ' + a.tel : ''}
          </div>
        </div>
      </div>
      ${a.anamnese ? `<div class="anamnese-box" id="anamnese-${a.id}">${buildAnamnese(a.anamnese)}</div>` : ''}
      <div class="entry-actions">
        <button class="btn btn-success" onclick="confirmarAgend('${a.id}')">✓ Confirmar</button>
        ${a.anamnese ? `<button class="btn btn-outline" onclick="toggleAnamnese('${a.id}')">📋 Anamnese</button>` : ''}
        <button class="btn btn-danger" onclick="deletarAgend('${a.id}')">✕</button>
      </div>
    </div>
  `).join('') : '<div class="empty">Nenhum agendamento pendente</div>';
  document.getElementById('lista-agendamentos').innerHTML = html;
}

// ══ RENDER CONFIRMADOS ══
function renderConfirmados() {
  const confirmados = agendamentosData.filter(a => a.status === 'Confirmado');
  const html = confirmados.length ? confirmados.map(a => `
    <div class="entry confirmed">
      <div class="entry-status status-confirmado">Confirmado</div>
      <div class="entry-header">
        <div>
          <div class="entry-name">${a.nome}</div>
          <div class="entry-desc">
            📅 ${formatDateBR(a.data)} às ${a.hora || '??:??'} • ${a.proc || 'Serviço'}
            ${a.tel ? ' • 📱 ' + a.tel : ''}
          </div>
        </div>
        <div class="entry-price">R$ ${a.valor || '0.00'}</div>
      </div>
      ${a.anamnese ? `<div class="anamnese-box" id="anamnese-${a.id}">${buildAnamnese(a.anamnese)}</div>` : ''}
      <div class="entry-actions">
        ${a.anamnese ? `<button class="btn btn-outline" onclick="toggleAnamnese('${a.id}')">📋 Anamnese</button>` : ''}
        <button class="btn btn-danger" onclick="deletarAgend('${a.id}')">✕</button>
      </div>
    </div>
  `).join('') : '<div class="empty">Nenhum agendamento confirmado</div>';
  document.getElementById('lista-confirmados').innerHTML = html;
}

// ══ BUILD ANAMNESE HTML ══
function buildAnamnese(a) {
  if (!a) return '';
  const rows = [
    ['Diabetes', a.diabetes],
    ['Gestante', a.gestante],
    ['Alergia', a.alergia + (a.alergiaDetalhe ? ' (' + a.alergiaDetalhe + ')' : '')],
    ['Micose', a.micose],
    ['Medicamento', a.medicamento + (a.medicamentoDetalhe ? ' (' + a.medicamentoDetalhe + ')' : '')],
    ['Unha encravada', a.encravada],
    ['Esporte', a.esporte],
  ];
  return rows.filter(r => r[1]).map(r =>
    `<div class="anamnese-row"><span class="anamnese-label">${r[0]}:</span> ${r[1]}</div>`
  ).join('');
}

// ══ AÇÕES ══
window.confirmarAgend = function(id) {
  db.ref('agendamentos/' + id).update({ status: 'Confirmado' })
    .then(() => toast('Confirmado!'))
    .catch(() => toast('Erro ao confirmar'));
};

window.deletarAgend = function(id) {
  if (!confirm('Remover agendamento?')) return;
  const agend = agendamentosData.find(a => a.id === id);
  db.ref('agendamentos/' + id).remove().then(() => {
    if (agend && agend.data && agend.hora) {
      const key = agend.data + '_' + agend.hora;
      db.ref('horarios_ocupados/' + key).remove();
    }
    toast('Removido!');
  }).catch(() => toast('Erro ao remover'));
};

window.toggleAnamnese = function(id) {
  const el = document.getElementById('anamnese-' + id);
  if (el) el.classList.toggle('show');
};

window.editarRegistro = function(id) {
  db.ref('registros/' + id).once('value').then(function(snap) {
    const r = snap.val();
    if (!r) return;
    editId = id;
    document.getElementById('nome').value       = r.nome;
    document.getElementById('data').value       = r.data;
    document.getElementById('tel').value        = r.tel || '';
    document.getElementById('proc').value       = r.proc;
    document.getElementById('valor').value      = r.valor;
    document.getElementById('pagamento').value  = r.pagamento || '';
    document.getElementById('status').value     = r.status || 'Confirmado';
    document.getElementById('hora-inicio').value = r.horaInicio || '';
    document.getElementById('hora-fim').value   = r.horaFim || '';
    const btn = document.getElementById('btn-submit');
    btn.textContent = 'Atualizar';
    btn.style.background = 'linear-gradient(135deg, #3b82f6, #2563eb)';
    toast('Editando...');
    switchTab('anotar', document.querySelectorAll('.tab-btn')[0]);
  });
};

window.deletarRegistro = function(id) {
  if (!confirm('Remover registro?')) return;
  db.ref('registros/' + id).remove().then(() => toast('Removido!'));
};

window.cancelEdit = function() {
  editId = null;
  const btn = document.getElementById('btn-submit');
  btn.textContent = 'Anotar';
  btn.style.background = '';
  ['nome','data','tel','valor','hora-inicio','hora-fim'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('proc').value = '';
  document.getElementById('pagamento').value = '';
};

// ══ FINANCEIRO ══
function renderFinanceiro() {
  const hoje = new Date();
  const mesAtual = hoje.toISOString().slice(0, 7);
  const registrosMes = registrosData.filter(r => r.data && r.data.startsWith(mesAtual));

  if (registrosMes.length === 0) {
    document.getElementById('financeiro-resumo').innerHTML = '<div class="empty">Nenhum registro este mês</div>';
    document.getElementById('financeiro-detalhes').innerHTML = '';
    return;
  }

  const total  = registrosMes.reduce((sum, r) => sum + parseFloat(r.valor || 0), 0);
  const count  = registrosMes.length;
  const media  = total / count;

  const porProc = {};
  const porPag  = {};

  registrosMes.forEach(r => {
    const p = r.proc || 'Outro';
    if (!porProc[p]) porProc[p] = { qtd: 0, valor: 0 };
    porProc[p].qtd++;
    porProc[p].valor += parseFloat(r.valor || 0);

    const pg = r.pagamento || 'Não informado';
    if (!porPag[pg]) porPag[pg] = { qtd: 0, valor: 0 };
    porPag[pg].qtd++;
    porPag[pg].valor += parseFloat(r.valor || 0);
  });

  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const nomeMes = meses[hoje.getMonth()];

  document.getElementById('financeiro-resumo').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">
      <div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;">
        <div style="font-size:22px;font-weight:700;color:var(--pink);">R$ ${total.toFixed(2)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;">Faturamento</div>
      </div>
      <div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;">
        <div style="font-size:22px;font-weight:700;color:var(--success);">${count}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;">Procedimentos</div>
      </div>
      <div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;">
        <div style="font-size:22px;font-weight:700;color:#3b82f6;">R$ ${media.toFixed(2)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;">Média</div>
      </div>
    </div>
    <div style="font-size:14px;font-weight:700;color:var(--pink);margin-bottom:12px;">Resumo — ${nomeMes}</div>
  `;

  let detalhes = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">';
  detalhes += '<div><div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;">Por Procedimento</div>';
  Object.keys(porProc).sort((a, b) => porProc[b].valor - porProc[a].valor).forEach(p => {
    detalhes += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
      <span style="font-size:13px;">${p} <span style="color:var(--muted);font-size:11px;">(${porProc[p].qtd}x)</span></span>
      <span style="font-size:13px;font-weight:600;">R$ ${porProc[p].valor.toFixed(2)}</span>
    </div>`;
  });
  detalhes += '</div>';
  detalhes += '<div><div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;">Por Pagamento</div>';
  Object.keys(porPag).sort((a, b) => porPag[b].valor - porPag[a].valor).forEach(p => {
    detalhes += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
      <span style="font-size:13px;">${p} <span style="color:var(--muted);font-size:11px;">(${porPag[p].qtd}x)</span></span>
      <span style="font-size:13px;font-weight:600;">R$ ${porPag[p].valor.toFixed(2)}</span>
    </div>`;
  });
  detalhes += '</div></div>';
  document.getElementById('financeiro-detalhes').innerHTML = detalhes;
}
</script>
