<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Emilly Santos</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #c9184a;
  --pink-dark: #a01435;
  --bg: #f8f9fa;
  --card: #ffffff;
  --text: #1a1a2e;
  --muted: #6b7280;
  --border: #e5e7eb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: linear-gradient(135deg, var(--pink-dark), var(--pink));
  padding: 20px 24px;
  color: white;
  text-align: center;
}

header h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
header p { font-size: 11px; opacity: 0.85; letter-spacing: 1.5px; text-transform: uppercase; }

main {
  flex: 1;
  padding: 24px;
  max-width: 700px;
  margin: 0 auto;
  width: 100%;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid var(--border);
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--pink);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-group {
  margin-bottom: 12px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--pink);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
}

.btn-primary {
  background: linear-gradient(135deg, var(--pink-dark), var(--pink));
  color: white;
}

.btn-danger {
  background: #ef4444;
  color: white;
  padding: 6px 10px;
  font-size: 12px;
  width: auto;
  border-radius: 8px;
}

/* LISTA */
.entry {
  display: flex;
  gap: 12px;
  padding: 14px;
  border-left: 4px solid var(--pink);
  background: var(--bg);
  border-radius: 12px;
  margin-bottom: 10px;
  align-items: center;
}

.entry-info { flex: 1; min-width: 0; }
.entry-name { font-size: 14px; font-weight: 600; }
.entry-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.entry-price { font-weight: 700; color: var(--pink); font-size: 15px; white-space: nowrap; }

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 14px;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, var(--pink-dark), var(--pink));
  color: white;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  z-index: 9999;
  animation: slideUp 0.4s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.loading {
  text-align: center;
  padding: 20px;
  color: var(--muted);
  font-size: 13px;
}

@media (max-width: 768px) {
  main { padding: 16px; }
  .card { padding: 16px; }
}
</style>
</head>
<body>

<header>
  <h1>Studio Emilly Santos</h1>
  <p>Registro de Procedimentos</p>
</header>

<main>

  <!-- ANOTAR -->
  <div class="card">
    <h2 class="card-title">Anotar Procedimento</h2>
    <form id="form-anotar">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="nome" placeholder="Nome da cliente" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="data" required>
        </div>
        <div class="form-group">
          <label>Telefone</label>
          <input type="tel" id="tel" placeholder="(11) 99999-9999" oninput="maskTel(this)">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Procedimento</label>
          <select id="proc" required>
            <option value="">Selecione</option>
            <option>Manicure</option>
            <option>Pedicure</option>
            <option>Unhas Postiças</option>
            <option>Design de Sobrancelha</option>
          </select>
        </div>
        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="number" id="valor" placeholder="0,00" step="0.01" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="btn-submit">Anotar</button>
    </form>
  </div>

  <!-- LISTA -->
  <div class="card">
    <h2 class="card-title">Procedimentos Anotados</h2>
    <div id="lista"><div class="loading">Carregando...</div></div>
  </div>

</main>

<script>
// ═══════════════════════════════════════════════════
//  CONFIGURAÇÃO FIREBASE (mesmo do agendar.html)
// ═══════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDBr3kQaZj_g_gxJ_h2f2zWv5C_-K9yEts",
  authDomain: "studio-emilly-santos.firebaseapp.com",
  databaseURL: "https://studio-emilly-santos-default-rtdb.firebaseio.com",
  projectId: "studio-emilly-santos",
  storageBucket: "studio-emilly-santos.appspot.com",
  messagingSenderId: "360676621995",
  appId: "1:360676621995:web:c0d9e78fea71c99ffc3e30"
};

let editId = null;

// MÁSCARA DE TELEFONE
function maskTel(el) {
  let v = el.value.replace(/\D/g, '').slice(0, 11);
  if (v.length >= 2) v = '(' + v.slice(0,2) + ') ' + v.slice(2);
  if (v.length >= 10) v = v.slice(0,10) + '-' + v.slice(10);
  el.value = v;
}

// TOAST
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// FIREBASE INIT
import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js').then(({initializeApp}) => {
  import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js').then(({getDatabase, ref, push, onValue, remove, set}) => {
    const app = initializeApp(FIREBASE_CONFIG);
    const db = getDatabase(app);
    const registrosRef = ref(db, 'registros');

    // CARREGAR REGISTROS
    onValue(registrosRef, (snap) => {
      let registros = [];
      snap.forEach(child => {
        registros.push({ id: child.key, ...child.val() });
      });
      render(registros);
    });

    // SALVAR
    document.getElementById('form-anotar').addEventListener('submit', (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const data = document.getElementById('data').value;
      const tel = document.getElementById('tel').value.trim();
      const proc = document.getElementById('proc').value;
      const valor = document.getElementById('valor').value;

      if (!nome || !data || !proc || !valor) {
        toast('Preencha os campos obrigatórios');
        return;
      }

      if (editId !== null) {
        // EDITAR
        set(ref(db, 'registros/' + editId), {
          nome, data, tel, proc, valor: parseFloat(valor).toFixed(2)
        }).then(() => {
          toast('Atualizado!');
          cancelEdit();
        });
      } else {
        // NOVO
        push(registrosRef, {
          nome, data, tel, proc, valor: parseFloat(valor).toFixed(2)
        }).then(() => {
          toast('Anotado!');
        });
      }

      e.target.reset();
    });

    // DELETAR
    window.deletar = function(id) {
      if (!confirm('Remover registro?')) return;
      remove(ref(db, 'registros/' + id)).then(() => {
        toast('Removido');
      });
    };

    // EDITAR
    window.editar = function(id) {
      onValue(ref(db, 'registros/' + id), (snap) => {
        const r = snap.val();
        if (!r) return;
        editId = id;
        document.getElementById('nome').value = r.nome;
        document.getElementById('data').value = r.data;
        document.getElementById('tel').value = r.tel || '';
        document.getElementById('proc').value = r.proc;
        document.getElementById('valor').value = r.valor;
        const btn = document.getElementById('btn-submit');
        btn.textContent = 'Atualizar';
        btn.style.background = 'linear-gradient(135deg, #3b82f6, #2563eb)';
        toast('Editando...');
      }, { onlyOnce: true });
    };

    // CANCELAR EDIÇÃO
    window.cancelEdit = function() {
      editId = null;
      document.getElementById('btn-submit').textContent = 'Anotar';
      document.getElementById('btn-submit').style.background = '';
      document.getElementById('form-anotar').reset();
    };

    // RENDERIZAR
    function render(registros) {
      registros.sort((a,b) => new Date(b.data) - new Date(a.data));
      const html = registros.length ? registros.map(r => `
        <div class="entry">
          <div class="entry-info">
            <div class="entry-name">${r.nome}</div>
            <div class="entry-desc">📅 ${new Date(r.data+'T00:00:00').toLocaleDateString('pt-BR')} • ${r.proc}${r.tel ? ' • 📱 '+r.tel : ''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="entry-price">R$ ${r.valor}</div>
            <button class="btn btn-danger" onclick="editar('${r.id}')">✏️</button>
            <button class="btn btn-danger" onclick="deletar('${r.id}')">✕</button>
          </div>
        </div>
      `).join('') : '<div class="empty">Nenhum registro anotado</div>';

      document.getElementById('lista').innerHTML = html;
    }

  });
});
</script>

</body>
</html>
