<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
    .card{background:#fff;padding:2rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);width:320px;}
    h1{margin-top:0;text-align:center;}
    input{width:100%;padding:0.5rem;margin:0.5rem 0;border:1px solid #ccc;border-radius:4px;}
    button{width:100%;padding:0.6rem;background:#c9184a;color:#fff;border:none;border-radius:4px;cursor:pointer;}
    a{display:block;margin-top:1rem;text-align:center;color:#c9184a;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Cadastre‑se</h1>
    <form id="signupForm">
      <input type="email" id="email" placeholder="E‑mail" required />
      <input type="password" id="password" placeholder="Senha" required />
      <button type="submit">Criar conta</button>
    </form>
    <a href="login.html">Já tem conta? Entrar</a>
  </div>

  <script type="module" src="auth.js"></script>
  <script type="module">
    import { signUp, observeAuth } from "./auth.js";
    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = e.target.email.value;
      const password = e.target.password.value;
      try {
        await signUp(email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        alert(err.message);
      }
    });
    // Se já estiver logado, redireciona
    observeAuth(user => { if (user) window.location.href = "dashboard.html"; });
  </script>
</body>
</html>
